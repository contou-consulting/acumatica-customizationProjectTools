name: Publish PowerShell Module
on:
    push:
        tags:
          - '[0-9]*.[0-9]*.[0-9]*'
          - 'v[0-9]*.[0-9]*.[0-9]*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to stamp for the dry run'
                required: false
                default: '1.3.0'
permissions:
  contents: read
  id-token: write # OIDC token exchange for nuget.org trusted publishing
jobs:
  publish:
    runs-on: windows-latest
    env:
      # Manual dispatch is a dry run: everything runs except the actual pushes.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
    - uses: actions/checkout@v4

    - name: Restore dependencies
      run: dotnet restore acumatica-customizationProjectTools.slnx

    - name: Build module in Release mode
      run: dotnet build acumatica-customizationProjectTools.slnx -c Release

    - name: Determine version
      shell: pwsh
      env:
          INPUT_VERSION: ${{ inputs.version }}
      run: |
        $tag = if ($env:DRY_RUN -eq 'true') { $env:INPUT_VERSION } else { $env:GITHUB_REF -replace 'refs/tags/', '' }
        Write-Host "Version tag: $tag (dry run: $env:DRY_RUN)"
        "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

    - name: Update Module Version from Tag
      shell: pwsh
      run: |
        $commitMsg = git log -1 --pretty=%B
        $releaseNotes = ($commitMsg -join "`n").Trim()
        Write-Host "GitHub Tag: $env:RELEASE_TAG"
        Write-Host "Release Notes: $releaseNotes"
        .\.github\Update-ModuleVersion.ps1 -GitHubTag $env:RELEASE_TAG -ReleaseNotes $releaseNotes

    - name: Test Module Manifest before Publish
      shell: pwsh
      run: Test-ModuleManifest -Path .\AcuPackageTools\AcuPackageTools.psd1

    - name: NuGet login (trusted publishing)
      uses: NuGet/login@v1
      id: nuget-login
      with:
          user: kvanderstoep

    - name: Pack and push AcuPackageTools.Core to nuget.org
      shell: pwsh
      env:
          NUGET_ORG_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          dotnet pack src/AcuPackageTools.Core/AcuPackageTools.Core.csproj -c Release /p:Version=$version -o artifacts
          if ($env:DRY_RUN -eq 'true') {
            Write-Host "Dry run: skipping push. Would push:"
            Get-ChildItem artifacts/*.nupkg | ForEach-Object { Write-Host "  $($_.Name)" }
          }
          else {
            dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_ORG_API_KEY --skip-duplicate
          }

    - name: Publish to PowerShell Gallery
      shell: pwsh
      env:
          NUGET_API_KEY: ${{ secrets.POWERSHELL_GALLERY_API_KEY }}
      run: |
          if ($env:DRY_RUN -eq 'true') {
            Publish-Module -Path .\AcuPackageTools -NuGetApiKey $env:NUGET_API_KEY -Verbose -WhatIf
          }
          else {
            Publish-Module -Path .\AcuPackageTools -NuGetApiKey $env:NUGET_API_KEY -Verbose
          }
